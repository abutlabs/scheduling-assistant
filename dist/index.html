<title>Flux Interviews</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
/* Flux Interviews · calm design (from Claude Design, design-handoff/from-design/).
   Warm paper background, white surfaces, one blue for "do this", orange-red
   only for Report. Inter Tight at light weights for big headings, Roboto Mono
   only for dates and counts. Every screen leads with one large next step;
   everything else sits in quiet rows or folds into a disclosure.
   The working tools (poll import, step matrix, roster) keep their sheet look. */
:root {
  --bg: #f7f6f3; --surface: #ffffff; --sunk: #efeee9; --line: #e6e4de;
  --fg: #1c1f23; --muted: #5d6269; --faint: #8c9096;
  --accent: #0b6e99; --accent-soft: #e2eef3; --on-accent: #ffffff;
  --report: #e4572e; --report-hover: #cc4824; --on-report: #ffffff;
  --warn: #a65c00; --warn-soft: #f7ead6;
  --ok: #1e7a46; --ok-soft: #dcede2;
  --bad: #b42318; --bad-soft: #fbe4e1;
  --scrim: rgba(28, 31, 35, .32);
  --shadow-card: 0 1px 2px rgba(28, 31, 35, .04), 0 8px 32px rgba(28, 31, 35, .06);
  --shadow-pop: 0 24px 80px rgba(0, 0, 0, .18);
  /* Sheet colours (poll, step matrix, roster) and older names, mapped onto the calm palette. */
  --s1: #f2f1ed; --s2: #e9e7e1; --grid: #dcd9d2;
  --accent-fg: var(--on-accent);
  --avail: #1e8e4e; --avail-fg: #ffffff; --avail-soft: #c8ebd5; --avail-soft-fg: #145c33;
  --no: #efeee9;
  --shadow: rgba(28, 31, 35, 0.12);

  --font-ui: "Inter Tight", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --t-display: 300 60px/1.05 var(--font-ui);
  --t-title: 300 44px/1.08 var(--font-ui);
  --t-next: 400 32px/1.2 var(--font-ui);
  --t-section: 400 28px/1.2 var(--font-ui);
  --t-lead: 400 18px/1.65 var(--font-ui);
  --t-body: 400 16px/1.6 var(--font-ui);
  --t-small: 400 14px/1.5 var(--font-ui);
  --t-data: 400 13px/1.4 var(--font-data);
  --track-tight: -0.03em;
  --gutter: 48px; --gutter-phone: 16px; --measure: 1100px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-dialog: 28px; --r-pill: 999px;
  --radius: var(--r-lg);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121416; --surface: #191c1f; --sunk: #202428; --line: #2a2e33;
    --fg: #e9e7e2; --muted: #a4a8ae; --faint: #71767d;
    --accent: #5fb4dc; --accent-soft: #16303b; --on-accent: #0b1418;
    --report: #f0714a; --report-hover: #f4876a; --on-report: #1a0d08;
    --warn: #f0a94a; --warn-soft: #3a2a12; --ok: #6fcf97; --ok-soft: #183626;
    --bad: #f2877b; --bad-soft: #3d1d1a; --scrim: rgba(0, 0, 0, .55);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 40px rgba(0, 0, 0, .35);
    --s1: #1a1d20; --s2: #24282d; --grid: #33383e;
    --avail: #2fa564; --avail-fg: #06140c; --avail-soft: #18392a; --avail-soft-fg: #8fdcae; --no: #1d2024; --shadow: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121416; --surface: #191c1f; --sunk: #202428; --line: #2a2e33;
  --fg: #e9e7e2; --muted: #a4a8ae; --faint: #71767d;
  --accent: #5fb4dc; --accent-soft: #16303b; --on-accent: #0b1418;
  --report: #f0714a; --report-hover: #f4876a; --on-report: #1a0d08;
  --warn: #f0a94a; --warn-soft: #3a2a12; --ok: #6fcf97; --ok-soft: #183626;
  --bad: #f2877b; --bad-soft: #3d1d1a; --scrim: rgba(0, 0, 0, .55);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 40px rgba(0, 0, 0, .35);
  --s1: #1a1d20; --s2: #24282d; --grid: #33383e;
  --avail: #2fa564; --avail-fg: #06140c; --avail-soft: #18392a; --avail-soft-fg: #8fdcae; --no: #1d2024; --shadow: rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--s1); }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 20px; font-weight: 650; }
h2 { font-size: 17px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
p { margin: 0; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 12px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--s1); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: stretch; column-gap: 4px; }
.bar .brand { font-weight: 700; padding: 11px 14px 11px 0; margin-right: 4px; border-right: 1px solid var(--line); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.bar .brand i { width: 14px; height: 14px; border-radius: 3px; background: linear-gradient(180deg, var(--avail) 0 50%, var(--accent) 50% 100%); }
.bar nav { display: flex; overflow-x: auto; scrollbar-width: none; }
.bar nav a { padding: 11px 12px 9px; font-size: 13.5px; font-weight: 600; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
.bar nav a:hover { color: var(--fg); }
.bar nav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); background: var(--bg); }
.bar nav a .n { font-family: var(--font-data); font-size: 11px; color: var(--faint); margin-left: 5px; }
.bar .camp { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); padding-block: 6px; }
.bar .camp select { font-weight: 600; }
.banner { background: var(--warn-soft); border-bottom: 1px solid var(--line); font-size: 12.5px; padding-block: 6px; }

main { display: flex; flex-direction: column; }
.section { padding-block: 14px; display: flex; flex-direction: column; gap: 12px; }
.section + .section { border-top: 1px solid var(--line); }
.band { background: var(--s1); border-bottom: 1px solid var(--line); }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; }
.head p { color: var(--muted); margin-top: 2px; }

/* Panels */
.tpanel { background: var(--bg); border: 1px solid var(--grid); border-radius: 6px; overflow: hidden; min-width: 0; }
.ph { padding: 8px 14px; border-bottom: 1px solid var(--line); font-weight: 650; font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.ph .faint { font-weight: 500; font-size: 12.5px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.grp { padding: 5px 14px; background: var(--s2); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); font-weight: 650; }
.act { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--line); align-items: center; font-size: 13px; }
.grp + .act { border-top: 0; }
.act b { display: block; font-weight: 600; }
.act p { color: var(--muted); }
@media (max-width: 520px) { .act { grid-template-columns: minmax(0, 1fr) auto; } .act .kind { grid-column: 1 / -1; justify-self: start; padding-inline: 8px; } }
.kind { font-size: 11px; font-weight: 700; padding: 3px 0; border-radius: 4px; text-align: center; background: var(--s2); color: var(--muted); }
.k-bad { background: var(--bad-soft); color: var(--bad); }
.k-accent { background: var(--accent-soft); color: var(--accent); }
.k-warn { background: var(--warn-soft); color: var(--warn); }
.empty { padding: 22px 16px; color: var(--muted); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.stat { padding: 8px 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; font-size: 12.5px; }
.stat:first-of-type { border-top: 0; }
.stat b { font-family: var(--font-data); font-weight: 600; }
.bar-track { grid-column: 1 / -1; height: 4px; background: var(--s2); border-radius: 2px; overflow: hidden; }
.bar-track i { display: block; height: 100%; background: var(--accent); }

/* Controls */
button { font: inherit; font-weight: 600; font-size: 12.5px; border: 1px solid var(--grid); background: var(--bg); color: var(--fg); border-radius: 4px; padding: 5px 10px; cursor: pointer; line-height: 1.3; white-space: nowrap; }
button:hover { background: var(--s2); }
button.p { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button.p:hover { filter: brightness(1.07); }
button.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; font-weight: 600; }
button.danger { color: var(--bad); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font: inherit; font-size: 13.5px; color: var(--fg); background: var(--bg); border: 1px solid var(--grid); border-radius: 4px; padding: 5px 8px; min-width: 0; }
textarea { width: 100%; min-height: 60px; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); min-width: 0; }
.fg { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.fg .wide { grid-column: 1 / -1; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 99px; font-size: 11.5px; font-weight: 650; background: var(--s2); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--avail-soft); color: var(--avail-soft-fg); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.team { font-family: var(--font-data); font-size: 11px; color: var(--muted); }
.warn-line { color: var(--warn); font-size: 12.5px; }
.err-line { color: var(--bad); font-size: 12.5px; }

/* Sheet tables (step matrix, poll, roster) */
.sheet-wrap { overflow-x: auto; border-top: 1px solid var(--grid); border-bottom: 1px solid var(--grid); }
table.x { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
table.x th, table.x td { border: 1px solid var(--grid); padding: 5px 8px; white-space: nowrap; }
table.x tr > :first-child { border-left: 0; }
table.x tr > :last-child { border-right: 0; }
table.x tr:first-child > * { border-top: 0; }
table.x tr:last-child > * { border-bottom: 0; }
table.x th { background: var(--s1); font-weight: 600; color: var(--muted); text-align: left; font-size: 11.5px; position: sticky; top: 0; }
table.x .rn { width: 30px; text-align: center; color: var(--faint); background: var(--s1); font-family: var(--font-data); font-size: 11px; }
table.x td.name { font-weight: 600; }
table.x td.name button { all: unset; cursor: pointer; font-weight: 600; }
table.x td.name button:hover { color: var(--accent); text-decoration: underline; }
table.x tr.sel td { background: var(--accent-soft); }
table.x tr.group td { background: var(--s2); font-weight: 650; font-size: 12px; color: var(--muted); }
table.x tr.inactive td { color: var(--faint); }
td.d { font-family: var(--font-data); font-size: 11.5px; text-align: center; cursor: pointer; padding: 0; }
td.d > button { all: unset; display: block; width: 100%; padding: 5px 8px; box-sizing: border-box; cursor: pointer; text-align: center; }
td.d.done { background: var(--avail-soft); color: var(--avail-soft-fg); }
td.d.next { background: var(--warn-soft); color: var(--warn); font-weight: 600; box-shadow: inset 0 0 0 2px var(--warn); }
td.d.rej { background: var(--bad-soft); color: var(--bad); }
td.d.skip { color: var(--warn); }
td.d.na { color: var(--faint); background: repeating-linear-gradient(135deg, transparent 0 4px, var(--s1) 4px 8px); cursor: default; }
td.d.na > button { cursor: default; }
td.d.up { color: var(--faint); }
td.clk { font-family: var(--font-data); font-weight: 600; text-align: center; }
td.clk.bad { color: var(--bad); }
td.clk.warn { color: var(--warn); }

/* Poll sheet */
td.v { font-size: 11.5px; text-align: center; min-width: 64px; }
td.v.all { background: var(--avail); color: var(--avail-fg); font-weight: 600; }
td.v.am, td.v.pm { background: var(--avail-soft); color: var(--avail-soft-fg); }
td.v.no { background: var(--no); color: var(--faint); }
td.v.null { background: repeating-linear-gradient(135deg, transparent 0 4px, var(--s1) 4px 8px); }
td.v.win { box-shadow: inset 0 0 0 2px var(--accent); }
td.v.pend { box-shadow: inset 0 0 0 2px var(--accent); background-image: none; outline: 1px dashed var(--accent); outline-offset: -5px; }
td.v.ten { box-shadow: inset 0 0 0 2px var(--warn); }
td.v.unav { box-shadow: inset 0 0 0 2px var(--bad); }
td.v small { display: block; font-family: var(--font-data); font-size: 10px; font-weight: 500; }
th.fri { color: var(--accent); }
td.rem { white-space: normal; min-width: 280px; max-width: 420px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
tr.sum td { background: var(--s1); font-family: var(--font-data); font-size: 11.5px; text-align: center; font-weight: 600; color: var(--faint); }
tr.sum td.ok { color: var(--avail); }
.ai { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 4px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 3px 6px; font-weight: 600; font-size: 11.5px; }
.ai.ok { background: var(--avail-soft); color: var(--avail-soft-fg); }
.ai.off { background: var(--s2); color: var(--faint); text-decoration: line-through; }
.ai.off button { text-decoration: none; }
.ai button { padding: 0 6px; font-size: 11px; border-radius: 3px; }
.ai button.p { border-color: var(--accent); }
.ai button.link { font-size: 11px; }
.rule-edit { margin-top: 6px; padding: 8px; border: 1px solid var(--accent); border-radius: 6px; background: var(--bg); display: flex; flex-direction: column; gap: 6px; color: var(--fg); }
.toggles { display: flex; flex-wrap: wrap; gap: 3px; }
.toggles button { padding: 1px 5px; font-family: var(--font-data); font-weight: 500; font-size: 11px; }
.toggles button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.sheet-tabs { display: flex; gap: 0; background: var(--s1); border-bottom: 1px solid var(--grid); padding-left: 30px; overflow-x: auto; }
.sheet-tabs button { border: 0; border-right: 1px solid var(--grid); border-radius: 0; background: none; color: var(--muted); padding: 6px 14px; font-weight: 500; }
.sheet-tabs button[aria-pressed="true"] { background: var(--bg); color: var(--fg); font-weight: 650; box-shadow: inset 0 2px 0 var(--accent); }
.fixes { background: var(--warn-soft); border-block: 1px solid var(--line); padding-block: 8px; font-size: 12.5px; display: flex; flex-direction: column; gap: 6px; }
.fix { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.fix .sev { font-weight: 700; color: var(--warn); }
.fix .sev.block { color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--muted); }
.legend .sw { display: inline-block; width: 26px; height: 14px; border: 1px solid var(--grid); vertical-align: -2px; margin-right: 4px; }
.drop { border: 2px dashed var(--grid); border-radius: 6px; padding: 18px 16px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; background: var(--bg); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }

/* Drawer */
.scrim { position: fixed; inset: 0; background: var(--shadow); z-index: 8; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 9; width: min(480px, 100%); background: var(--bg); border-left: 1px solid var(--grid);
  box-shadow: -12px 0 32px var(--shadow); overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px;
}
.drawer .x { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); border: 0; font-size: 18px; padding: 2px 8px; }
.contact { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--muted); font-size: 13px; }
.contact span { user-select: all; }
.steps { border: 1px solid var(--grid); border-radius: 6px; display: flex; flex-direction: column; }
.steps > div { border-top: 1px solid var(--line); }
.steps > div:first-child { border-top: 0; }
.steps .st { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; align-items: baseline; }
.steps .st:hover { background: var(--s1); }
.steps .st i { font-style: normal; font-family: var(--font-data); font-size: 11px; color: var(--faint); }
.steps .st .when { font-family: var(--font-data); font-size: 11.5px; color: var(--muted); }
.steps .done .st i { color: var(--avail); }
.steps .done.rej .st i { color: var(--bad); }
.steps .next .st { background: var(--warn-soft); font-weight: 650; }
.steps .up .st, .steps .na .st { color: var(--faint); }
.steps .skip .st { color: var(--warn); }
.steps .detail { padding: 0 10px 8px 44px; font-size: 12.5px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.steps .open { background: var(--s1); }
.step-form { padding: 10px; margin: 0 8px 8px; border: 1px solid var(--accent); border-radius: 6px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
.radios { display: flex; flex-wrap: wrap; gap: 6px; }
.radios button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.slots { display: flex; flex-wrap: wrap; gap: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 13px; max-width: calc(100% - 32px); }
details > summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 12.5px; }
@media (prefers-reduced-motion: no-preference) { button, .steps .st { transition: background-color 0.12s ease; } }

/* Mock sidecar: a test tool docked on the left, visibly different from the app (dashed warning edge). */
.sidecar {
  position: fixed; left: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + 46px); z-index: 7; width: min(400px, 100%);
  background: var(--s1); border-right: 3px dashed var(--warn); box-shadow: 12px 0 32px var(--shadow); overflow-y: auto;
  padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sidecar .x { border: 0; font-size: 18px; padding: 2px 8px; background: none; }
.mock-sec { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--grid); }
.mock-card { background: var(--bg); border: 1px solid var(--grid); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }


/* View switch and interviewer page */
.viewas { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.viewas select { max-width: 190px; }
.banner.preview { background: var(--accent-soft); color: var(--accent); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.iv-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .iv-grid { grid-template-columns: minmax(0, 1fr); } }
.iv-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.iv-card { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.iv-card h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.iv-item { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.iv-card h2 + .iv-item, .iv-card h2 + p + .iv-item { border-top: 0; padding-top: 0; }
.brief-box { display: flex; flex-direction: column; gap: 6px; background: var(--s1); border-radius: 6px; padding: 8px 10px; }
.brief-out { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
.score .big { font-size: 34px; font-weight: 700; font-family: var(--font-data); line-height: 1; color: var(--accent); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.kpi { display: flex; flex-direction: column; gap: 1px; background: var(--s1); border-radius: 6px; padding: 8px 10px; }
.kpi b { font-size: 20px; font-family: var(--font-data); }
.meter { height: 8px; background: var(--s2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--avail); border-radius: 99px; }
.meter.thin { height: 6px; margin: 0; }
.meter.thin i { background: var(--accent); }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 28px; gap: 8px; align-items: center; }
.avail-strip td.v { min-width: 44px; font-size: 11px; }
.avail-strip th.wk { border-left: 2px solid var(--grid); }
.warn-t { color: var(--warn); }
@media (max-width: 700px) {
  .bar .camp { flex-wrap: wrap; margin-left: 0; width: 100%; }
  .viewas > span { display: none; }
  .bar .camp > span { display: none; }
  .viewas select { max-width: 150px; }
}
@media (max-width: 600px) { .wide-only { display: none; } }
.seg { display: inline-flex; border: 1px solid var(--grid); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 10px; background: var(--bg); font-weight: 600; font-size: 12.5px; }
.seg button + button { border-left: 1px solid var(--grid); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg, #fff); }
.sim-log { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; max-height: 260px; overflow-y: auto; }


/* Wizard */
.wizard { display: flex; flex-direction: column; gap: 28px; max-width: 900px; }
.wiz-step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; }
.wiz-num { width: 32px; height: 32px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; }
.wiz-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.wiz-round { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
.structs { display: flex; flex-direction: column; gap: 8px; }
.struct { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid var(--grid); border-radius: var(--radius); }
.struct[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.picker { display: flex; flex-direction: column; gap: 10px; }
.picker-team { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; align-items: start; }
.picker-label { font-family: var(--font-data); font-size: 12.5px; color: var(--muted); padding-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border-radius: 99px; padding: 5px 12px; font-weight: 500; }
.pick[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.big-btn { padding: 10px 22px; font-size: 15px; }
.invite-box { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--s1); }
.invite-text { white-space: pre-wrap; font-family: var(--font-ui); font-size: 14px; margin: 0; padding: 14px 16px; background: var(--bg); border-radius: 10px; border: 1px solid var(--line); }
.people-list { display: flex; flex-direction: column; }
.person-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }

/* Report button and dialog */
.shot { display: flex; flex-direction: column; gap: 8px; }
.shot img { width: 100%; max-height: 260px; object-fit: contain; object-position: top left; border: 1px solid var(--line); border-radius: 8px; background: var(--s1); }
.shot img.big { max-height: none; }

/* Developer view */
.dev { max-width: 900px; }
.report-card { display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius); }
.report-what { font-size: 16px; white-space: pre-wrap; }
.err-pre { margin: 0; padding: 8px 10px; background: var(--bad-soft); color: var(--bad); border-radius: 8px; white-space: pre-wrap; }
.seg button { padding: 6px 12px; }
details.round-sum { border-top: 1px solid var(--line); }
details.round-sum > summary { padding: 12px 0; cursor: pointer; }
details.round-sum[open] > summary { padding-bottom: 8px; }

/* ------------------------------------------------------------------
   Calm redesign (Claude Design, design-handoff/from-design/calm.css),
   adapted to the app's markup. Loaded last, so it wins over the sheet
   styles above where both apply.
   ------------------------------------------------------------------ */
body { background: var(--bg); color: var(--fg); font: var(--t-body); margin: 0; -webkit-font-smoothing: antialiased; }
body::before { background: var(--bg); }
h1 { font: var(--t-section); letter-spacing: -0.015em; }
h2 { font-size: 20px; font-weight: 500; letter-spacing: -0.005em; }
h3 { font-size: 16px; font-weight: 600; }
.small { font-size: 14px; }
.mono { font-size: 13px; }
a { color: var(--accent); }
a:hover { color: var(--fg); }
main { max-width: 1280px; margin: 0 auto; width: 100%; }
.gutter { padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); }
@media (max-width: 900px) { .gutter { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); } }
@media (max-width: 600px) { .gutter { padding-left: max(var(--gutter-phone), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter-phone), env(safe-area-inset-right, 0px)); } }
.section { padding-block: 32px; gap: 20px; }
.section + .section { border-top: 0; }
.band { background: transparent; border-bottom: 0; }
.head p { color: var(--muted); margin-top: 6px; font-size: 16px; }
summary { list-style: none; cursor: pointer; color: var(--muted); }
summary::-webkit-details-marker { display: none; }
details > summary { font-weight: 400; font-size: 15px; }
details > summary::after { content: " ▸"; }
details[open] > summary::after { content: " ▾"; }
details.plus > summary::after { content: none; }

/* Top bar: brand · nav · (test pill, campaign, name menu) · Report */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 12; min-height: 68px; display: flex; flex-wrap: nowrap; align-items: center; gap: 44px; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; padding: 0; margin: 0; border: 0; white-space: nowrap; }
.bar .brand::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: var(--accent); flex: none; }
.bar nav { display: flex; gap: 28px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.bar nav a { font-size: 15px; font-weight: 400; color: var(--muted); text-decoration: none; padding: 6px 0; border: 0; background: none; }
.bar nav a:hover { color: var(--fg); }
.bar nav a[aria-current="page"] { color: var(--fg); font-weight: 500; background: none; }
.bar .end { margin-left: auto; display: flex; align-items: center; gap: 22px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.bar .camp-pick { border: 0; background: transparent; color: var(--muted); font-size: 14px; padding: 4px 2px; border-radius: var(--r-sm); cursor: pointer; max-width: 200px; }
.bar .camp-pick:hover { color: var(--fg); }
.test-pill { padding: 4px 10px; border-radius: var(--r-pill); background: var(--warn-soft); color: var(--warn); font-size: 12.5px; font-weight: 500; border: 0; }
button.test-pill:hover { background: var(--warn-soft); filter: brightness(0.97); }
.view-pill { padding: 5px 12px; border-radius: var(--r-pill); background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 500; border: 0; }
button.view-pill:hover { background: var(--accent-soft); text-decoration: underline; }
.menu { position: relative; }
.menu > summary { font-size: 14px; color: var(--muted); padding: 6px 0; }
.menu > summary:hover { color: var(--fg); }
.menu > summary::after { content: " ▾"; }
.menu[open] > summary::after { content: " ▴"; }
.menu-panel { position: absolute; right: 0; top: calc(100% + 10px); z-index: 30; width: 320px; max-width: calc(100vw - 32px); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); padding: 18px; display: flex; flex-direction: column; gap: 14px; color: var(--fg); white-space: normal; }
.menu-panel .label { font-size: 13px; color: var(--muted); }
.menu-panel .seg { flex-wrap: wrap; }
.menu-panel select { width: 100%; }
.menu-panel hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }
@media (max-width: 760px) {
  .bar { min-height: 60px; gap: 16px; }
  .bar .brand span, .test-pill, .bar .camp-pick { display: none; }
  .bar nav { gap: 18px; }
  .bar .end { gap: 12px; }
}

/* Buttons */
button { font: 500 15px/1.2 var(--font-ui); padding: 9px 18px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; white-space: nowrap; }
button:hover { background: var(--sunk); }
button.p { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.p:hover { background: var(--accent); filter: brightness(1.08); }
button.big, .act-hero button.p, .iv-request button.p, .dialog .foot button.p, .drawer .next button.p { font-size: 16px; padding: 14px 28px; }
.iv-request button:not(.p):not(.link), .act-hero button:not(.p):not(.link) { font-size: 16px; padding: 13px 24px; }
button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: none; font-weight: 500; }
button.link:hover { background: none; text-decoration: underline; }
button.quiet { border: 0; background: none; padding: 0; color: var(--muted); font-weight: 400; }
button.quiet:hover { background: none; color: var(--fg); }
button.danger { color: var(--bad); }
.report-btn { background: var(--report); border-color: var(--report); color: var(--on-report); font-weight: 600; font-size: 14px; padding: 9px 18px; }
.report-btn:hover { background: var(--report-hover); border-color: var(--report-hover); }
table.x button, .ai button, .toggles button, .fix button, .mock-card button { font-size: 13px; padding: 4px 10px; }
.seg { border-color: var(--line); border-radius: var(--r-pill); background: var(--surface); }
.seg button { border-radius: 0; padding: 7px 14px; font-size: 14px; font-weight: 500; border: 0; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
@media (max-width: 600px) { button { min-height: 44px; } table.x button, .seg button, .toggles button, .ai button { min-height: 0; } .act-hero button.p, .iv-request button.p { width: 100%; } }

/* Fields */
input, select, textarea { font: var(--t-body); font-size: 16px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; }
textarea { border-radius: var(--r-lg); padding: 14px 16px; min-height: 84px; }
input[type="checkbox"], input[type="radio"] { padding: 0; accent-color: var(--accent); width: 18px; height: 18px; }
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.drawer input, .drawer select, .drawer textarea, .dialog input, .dialog textarea, .dialog select, .iv-request input, .act-hero input { background: var(--bg); }
table.x input, table.x select, .ai input, .rule-edit input, .rule-edit select { font-size: 13.5px; padding: 5px 8px; border-radius: var(--r-sm); }
label.f { font-size: 14px; font-weight: 400; gap: 6px; color: var(--muted); }
.check { font-size: 15px; gap: 10px; }
.chip { font-size: 13px; font-weight: 500; padding: 2px 10px; background: var(--sunk); }
.chip.good, .pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-ok { padding: 5px 12px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.warn-line, .err-line { font-size: 14px; }
.toast { border-radius: var(--r-pill); padding: 12px 22px; font-size: 15px; font-weight: 500; box-shadow: var(--shadow-pop); }

/* Panels and sheets */
.tpanel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.ph { padding: 14px 18px; font-weight: 500; font-size: 15px; }
.sheet-wrap { border-color: var(--line); }
table.x { font-size: 13.5px; }
table.x th, table.x td { padding-block: 8px; }
table.x th { background: var(--s1); }
.calm-empty { padding: 40px 0; color: var(--muted); display: flex; flex-direction: column; gap: 16px; align-items: flex-start; font-size: 17px; }

/* ---- Natalie's home: Today ---- */
.home { max-width: calc(var(--measure) + 2 * var(--gutter)); margin: 0 auto; width: 100%; padding-inline: var(--gutter); }
@media (max-width: 900px) { .home { padding-inline: 24px; } }
@media (max-width: 600px) { .home { padding-inline: var(--gutter-phone); } }
.calm-head { padding-top: 72px; display: flex; flex-direction: column; }
.calm-head .date { font-size: 16px; color: var(--muted); }
.calm-head h1 { font: var(--t-display); letter-spacing: var(--track-tight); margin: 10px 0 0; text-wrap: balance; }
.calm-head .lead { font: var(--t-lead); color: var(--muted); margin-top: 14px; }
@media (max-width: 600px) { .calm-head { padding-top: 36px; } .calm-head h1 { font-size: 38px; line-height: 1.08; } }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 96px; padding-block: 56px 80px; align-items: start; }
.cols.iv-cols { grid-template-columns: minmax(0, 1fr) 300px; }
@media (max-width: 900px) { .cols, .cols.iv-cols { grid-template-columns: minmax(0, 1fr); gap: 48px; padding-block: 32px 48px; } }
.home .cols:first-of-type { padding-top: 0; }

.act-hero { background: var(--surface); border-radius: var(--r-xl); padding: 40px 44px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 14px; }
.act-hero .kicker { font-size: 14px; font-weight: 500; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.act-hero .kicker::before { content: ""; width: 7px; height: 7px; border-radius: 99px; background: currentColor; }
.act-hero.tone-warn .kicker, .act-hero.tone-bad .kicker { color: var(--warn); }
.act-hero.tone-bad .kicker { color: var(--bad); }
.act-hero h2 { font: var(--t-next); letter-spacing: -0.015em; margin: 0; }
.act-hero p { font-size: 17px; color: var(--muted); margin: 0; }
.act-hero .row { margin-top: 14px; gap: 18px; }
.act-hero .row button.link { color: var(--muted); font-weight: 400; font-size: 16px; }
@media (max-width: 600px) { .act-hero { padding: 26px 22px; } .act-hero h2 { font-size: 24px; } .act-hero .row { flex-direction: column; align-items: stretch; } }
.then { font-size: 14px; color: var(--muted); margin: 44px 0 10px; }

.act { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 20px; padding: 22px 0; border-top: 1px solid var(--line); align-items: start; font-size: 16px; }
.act:last-child { border-bottom: 1px solid var(--line); }
.act b { display: block; font-size: 17px; font-weight: 500; }
.act p { font-size: 15px; color: var(--muted); margin: 4px 0 0; }
.act .dot { width: 8px; height: 8px; border-radius: 99px; margin-top: 9px; background: var(--line); }
.act.tone-accent .dot { background: var(--accent); }
.act.tone-warn .dot { background: var(--warn); }
.act.tone-bad .dot { background: var(--bad); }
.act > button { font-size: 14px; padding: 8px 16px; }
@media (max-width: 600px) { .act { grid-template-columns: minmax(0, 1fr) auto; gap: 12px; } .act .dot { display: none; } }
.more { margin-top: 18px; }
details.later { border: 0; margin-top: 20px; }
details.later > summary { padding: 4px 0; font-size: 15px; font-weight: 400; color: var(--muted); }
details.later[open] > summary { margin-bottom: 8px; }

.progress { display: flex; flex-direction: column; }
.progress .label { font-size: 14px; color: var(--muted); }
.progress .big-num { font: 300 64px/1 var(--font-ui); letter-spacing: var(--track-tight); margin-top: 14px; }
.progress .big-num span { font-size: 17px; color: var(--muted); font-family: var(--font-ui); font-weight: 400; letter-spacing: 0; }
.track { height: 4px; border-radius: 99px; background: var(--sunk); margin: 18px 0 22px; overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); min-width: 6px; }
.stat-list { display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: var(--muted); }
.stat-list div { display: flex; justify-content: space-between; gap: 12px; }
.stat-list b { font-weight: 400; color: var(--fg); font-family: var(--font-data); font-size: 14px; }
@media (max-width: 900px) { .progress { background: var(--sunk); border-radius: var(--r-xl); padding: 24px; } .progress .big-num { font-size: 48px; } }

/* Candidates */
.cand-sec { padding-bottom: 96px; }
.cand-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 22px; margin-bottom: 14px; }
.cand-head h2 { font: var(--t-section); letter-spacing: -0.015em; }
.cand-head .filters { display: flex; gap: 16px; }
.cand-head .filters button { border: 0; background: none; padding: 0; font-size: 14px; color: var(--muted); font-weight: 400; min-height: 0; }
.cand-head .filters button[aria-pressed="true"] { color: var(--fg); font-weight: 500; }
.cand-head .add { margin-left: auto; }
.cand-list { display: flex; flex-direction: column; }
.cand-row { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: minmax(140px, 220px) 140px minmax(0, 1fr) auto; gap: 20px; align-items: baseline; padding: 18px 0; border-top: 1px solid var(--line); font-size: 16px; }
.cand-row:last-child { border-bottom: 1px solid var(--line); }
.cand-row b { font-weight: 500; }
.cand-row .round { font-size: 14px; color: var(--muted); }
.cand-row .round.closed { color: var(--faint); }
.cand-row .next { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cand-row .day { font: var(--t-data); color: var(--muted); white-space: nowrap; }
.cand-row .day.late { color: var(--warn); }
.cand-row .day.bad { color: var(--bad); }
.cand-row:hover b, .cand-row:focus-visible b { color: var(--accent); }
@media (max-width: 700px) { .cand-row { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; } .cand-row .round { order: 3; } .cand-row .next { grid-column: 1 / -1; order: 4; white-space: normal; } }
.cand-foot { margin-top: 18px; }
.cand-sec .sheet-wrap { margin-top: 8px; border-radius: var(--r-md); border: 1px solid var(--line); }

/* ---- Candidate drawer ---- */
.scrim { background: var(--scrim); z-index: 14; }
.drawer { z-index: 15; width: min(600px, 100%); background: var(--surface); border-left: 0; box-shadow: -12px 0 40px rgba(0, 0, 0, .08); gap: 0;
  padding: calc(32px + env(safe-area-inset-top, 0px)) max(48px, env(safe-area-inset-right, 0px)) calc(64px + env(safe-area-inset-bottom, 0px)) 48px; }
.drawer .x { top: calc(24px + env(safe-area-inset-top, 0px)); right: max(28px, env(safe-area-inset-right, 0px)); font-size: 24px; line-height: 1; padding: 6px 10px; background: none; border: 0; color: var(--muted); }
.drawer .x:hover { color: var(--fg); background: none; }
.drawer .eyebrow { font-size: 14px; color: var(--muted); padding-right: 40px; }
.drawer h1 { font: var(--t-title); letter-spacing: -0.025em; margin: 24px 0 0; overflow-wrap: anywhere; }
.drawer .sub { font-size: 16px; color: var(--muted); margin-top: 6px; }
.drawer .sub .late { color: var(--warn); }
.drawer .sub .bad { color: var(--bad); }
.drawer .contact { margin-top: 10px; font-size: 14px; gap: 4px 16px; }
.drawer .cnotes { margin-top: 10px; font-size: 15px; color: var(--muted); white-space: pre-wrap; }
.drawer .next { padding: 28px; border-radius: 18px; background: var(--sunk); margin-top: 36px; display: flex; flex-direction: column; gap: 10px; }
.drawer .next .kicker { font-size: 14px; font-weight: 500; color: var(--accent); }
.drawer .next h2 { font: 400 26px/1.2 var(--font-ui); letter-spacing: -0.01em; margin: 0; }
.drawer .next > p { font-size: 16px; color: var(--muted); }
.drawer .next .step-form { margin: 8px 0 0; padding: 0; border: 0; background: transparent; }
.drawer .next .row.go { margin-top: 8px; gap: 12px; }
.drawer .dsec { margin-top: 40px; display: flex; flex-direction: column; gap: 4px; }
.drawer .dsec > .label, .drawer .label { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.drawer .dsec > h2 { font-size: 22px; font-weight: 400; margin-bottom: 10px; }
.step-list { display: flex; flex-direction: column; }
.step { display: flex; flex-direction: column; }
.step > .st { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 0; font-size: 16px; }
.step > .st:hover .lbl { color: var(--accent); }
.step .mark { width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; }
.step .when { font: var(--t-data); color: var(--muted); }
.step.done .mark { background: var(--ok-soft); color: var(--ok); }
.step.done.rej .mark { background: var(--bad-soft); color: var(--bad); }
.step.now .mark { border: 2px solid var(--accent); box-sizing: border-box; }
.step.now .mark::after { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--accent); }
.step.now .lbl { font-weight: 500; }
.step.later { color: var(--faint); }
.step.later .mark::after, .step.na .mark::after { content: ""; width: 5px; height: 5px; border-radius: 99px; background: var(--line); }
.step.na { color: var(--faint); }
.step.skip { color: var(--warn); }
.step.skip .mark { background: var(--warn-soft); color: var(--warn); }
.step .detail { padding: 0 0 10px 36px; font-size: 14px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.step > .step-form { margin: 4px 0 12px 36px; }
details.fold-steps > summary { padding: 10px 0; display: flex; align-items: center; gap: 14px; font-size: 15px; }
details.fold-steps.done-sum > summary::before { content: "✓"; width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); font-size: 12px; flex: none; }
details.fold-steps.more-sum > summary { padding-left: 36px; }
.step-form { padding: 18px; margin: 0; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg); gap: 14px; }
.radios button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.drawer .tpanel { background: var(--surface); }
.from-iv { display: flex; flex-direction: column; }
.from-iv .fb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
.from-iv .fb .lean { color: var(--ok); }
.from-iv .fb .lean.no { color: var(--bad); }
.from-iv .fb .lean.unsure { color: var(--warn); }
.from-iv .fb p { grid-column: 1 / -1; font-size: 15px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.brief { border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); }
.brief .bh { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 14px; }
.brief .bh h3 { font-size: 20px; font-weight: 500; }
.brief .bh span { font-size: 13px; color: var(--muted); }
.brief-out { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; font-size: 15.5px; }
.note-list { display: flex; flex-direction: column; }
.note-item { padding: 16px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.note-item .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.note-item p { font-size: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.note-form { display: flex; flex-direction: column; gap: 10px; }
.note-form textarea { min-height: 76px; }
@media (max-width: 600px) { .drawer { padding: calc(28px + env(safe-area-inset-top, 0px)) 16px 56px; } .drawer h1 { font-size: 36px; } .drawer .x { right: 10px; top: 16px; } .drawer .next { padding: 22px 18px; } }

/* ---- Advisor / team lead home ---- */
.iv-home .kicker { font-size: 16px; color: var(--muted); }
.iv-request { background: var(--surface); border-radius: var(--r-xl); padding: 40px 44px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 12px; }
.iv-request + .iv-request { margin-top: 24px; }
.iv-request .kick { font-size: 14px; font-weight: 500; color: var(--accent); }
.iv-request .when { font: 400 34px/1.15 var(--font-ui); letter-spacing: -0.015em; }
.iv-request p { font-size: 17px; color: var(--muted); max-width: 52ch; }
.iv-request .row { margin-top: 14px; gap: 14px; }
.iv-request details > summary { font-size: 14px; }
.iv-request details input { width: 100%; margin-top: 8px; }
@media (max-width: 600px) { .iv-request { padding: 26px 22px; } .iv-request .when { font-size: 28px; } .iv-request .row { flex-direction: column; align-items: stretch; } }
.answered { display: flex; flex-direction: column; margin-top: 24px; }
.answered .a { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 0; border-top: 1px solid var(--line); font-size: 15px; }
.iv-sec { margin-top: 72px; }
.iv-sec > h2 { font: var(--t-section); letter-spacing: -0.015em; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
@media (max-width: 600px) { .iv-sec { margin-top: 48px; } .iv-sec > h2 { font-size: 24px; } }
.iv-row { padding: 20px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.iv-row .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.iv-row .top b { font-size: 18px; font-weight: 500; }
.iv-row .meta { font-size: 15px; color: var(--muted); }
.iv-row .step-form { margin-top: 8px; }
.iv-row .earlier { font-size: 14px; color: var(--muted); }
details.fold { border-bottom: 1px solid var(--line); }
details.fold > summary { padding: 20px 0; font-size: 15px; }
details.fold[open] > summary { padding-bottom: 12px; }
details.fold > .fold-body { padding-bottom: 24px; display: flex; flex-direction: column; gap: 12px; }
details.fold .tpanel { border: 0; background: transparent; }
.iv-aside { display: flex; flex-direction: column; gap: 48px; padding-top: 28px; }
.iv-aside .blk { display: flex; flex-direction: column; gap: 10px; }
.iv-aside .label { font-size: 14px; color: var(--muted); }
.iv-aside p { font-size: 15px; color: var(--muted); }
.iv-aside details > summary { font-size: 15px; padding: 4px 0; }
.iv-aside details[open] > summary { margin-bottom: 10px; }
.rank { font: 300 30px/1.2 var(--font-ui); letter-spacing: -0.01em; }
.iv-aside .big-num { font: 300 56px/1 var(--font-ui); letter-spacing: var(--track-tight); }
.iv-aside .big-num span { font-size: 16px; color: var(--muted); letter-spacing: 0; }
.iv-aside .track { margin: 8px 0 6px; }
.iv-aside .kpis { grid-template-columns: 1fr 1fr; }
.kpi { background: var(--sunk); border-radius: var(--r-md); padding: 12px 14px; }
.kpi b { font: 300 26px/1.1 var(--font-ui); }
@media (max-width: 900px) { .iv-aside { padding-top: 0; gap: 16px; } .iv-aside .blk { background: var(--sunk); border-radius: var(--r-xl); padding: 22px; } .iv-aside .kpi { background: var(--surface); } }
.brief-box { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; gap: 10px; }

/* ---- Dialogs: welcome + report ---- */
.dialog-wrap { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.dialog { width: min(640px, 100%); background: var(--surface); border-radius: var(--r-dialog); padding: 56px 60px 48px; box-shadow: var(--shadow-pop); display: flex; flex-direction: column; gap: 18px; }
.dialog .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--muted); }
.dialog h1 { font: var(--t-title); letter-spacing: -0.025em; margin: 0; }
.dialog .lead { font: var(--t-lead); color: var(--fg); }
.dialog .lead.soft { color: var(--muted); }
.dialog .sub { font-size: 16px; color: var(--muted); margin-top: -10px; }
.dialog details > summary { color: var(--accent); font-size: 16px; }
.dialog details[open] > summary { margin-bottom: 10px; }
.dialog .foot { display: flex; align-items: center; gap: 20px; border-top: 1px solid var(--line); padding-top: 24px; margin-top: 10px; }
.dialog .foot .note { flex: 1; font-size: 13.5px; color: var(--muted); }
.dialog .foot.plain { border-top: 0; padding-top: 0; justify-content: flex-end; }
.dialog .x { border: 0; background: none; font-size: 24px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.dialog .x:hover { background: none; color: var(--fg); }
.dialog.report { width: min(600px, 100%); padding: 44px 48px 40px; }
.dialog.report h1 { font-size: 32px; line-height: 1.15; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { padding: 9px 16px; border-radius: var(--r-pill); border: 1px solid var(--line); font-size: 15px; font-weight: 400; background: var(--surface); }
.choice[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.dialog label.f textarea { width: 100%; }
.shot img { border-radius: var(--r-lg); border-color: var(--line); background: var(--sunk); max-height: 180px; }
@media (max-width: 600px) {
  .dialog-wrap { place-items: end stretch; padding: 0; }
  .dialog, .dialog.report { width: 100%; border-radius: 28px 28px 0 0; padding: 28px 20px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .dialog.welcome { border-radius: 0; min-height: 100%; padding: 36px 20px; }
  .dialog h1 { font-size: 36px; }
  .dialog.report h1 { font-size: 28px; }
  .dialog .foot { flex-wrap: wrap; }
  .dialog .foot .note { flex-basis: 100%; }
  .dialog .foot button.p { flex: 1; }
}

/* Mock sidecar sits under the taller bar. */
.sidecar { top: calc(env(safe-area-inset-top, 0px) + 68px); z-index: 11; background: var(--bg); }
.mock-card { background: var(--surface); border-color: var(--line); border-radius: var(--r-md); }
.menu-panel .viewas { display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
.menu-panel .viewas > span { display: block; }
.menu-panel .viewas select { max-width: none; }
.iv-aside details .iv-card { border: 0; background: transparent; padding: 0; }
.iv-aside details .iv-card > h2, .iv-aside details .iv-card > .row.small.muted { display: none; }
.iv-aside .iv-card .kpis { grid-template-columns: 1fr 1fr; }
.iv-cols { padding-top: 0; }
@media (min-width: 901px) { .iv-aside { padding-top: 100px; } }
.iv-home .calm-head .kicker + h1 { margin-top: 10px; }
.dialog .top h1 { color: var(--fg); }
.menu-panel nav.phone-only { display: none; }
@media (max-width: 600px) {
  .bar > nav a:not([aria-current="page"]) { display: none; }
  .bar > nav a[aria-current="page"] { font-weight: 600; font-size: 16px; }
  .menu-panel nav.phone-only { display: flex; flex-direction: column; gap: 2px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .menu-panel nav.phone-only a { padding: 10px 0; font-size: 17px; color: var(--fg); text-decoration: none; }
  .menu-panel nav.phone-only a[aria-current="page"] { color: var(--accent); }
  .menu-panel { position: fixed; top: 64px; right: 12px; }
}
.menu-panel .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; border: 0; background: none; overflow: visible; border-radius: 0; }
.menu-panel .seg button, .menu-panel .seg button + button { border: 1px solid var(--line); border-radius: var(--r-pill); }
.menu-panel .seg button[aria-pressed="true"] { border-color: var(--accent); }
table.x td { background: var(--surface); }

/* ---- Calm layer for the working screens: Availability, poll import, Roster,
   Campaign and Developer reports. Same page head as Today (large light
   title, quiet lead), section titles at the section size, sheets framed as
   white cards. The sheets themselves keep their grid look. ---- */
.section > .head h1, .section > h1 { font: var(--t-title); letter-spacing: var(--track-tight); margin: 0; }
.section > .head p { font: var(--t-lead); color: var(--muted); margin-top: 12px; max-width: 72ch; }
.section:first-of-type, .bar + .section, .bar + * > .section:first-child { padding-top: 64px; }
.section > .head h2, .section > h2 { font: var(--t-section); letter-spacing: -0.01em; margin: 0; }
.section > .head + p.small, .section > h2 + p.small { font-size: 15px; color: var(--muted); }
.section .seg { align-self: flex-start; }
.drop { border-radius: var(--r-xl); border-color: var(--line); background: var(--surface); padding-block: 40px; }
.drop b, .drop h3 { font: var(--t-next); font-size: 24px; }
.fixes { border-radius: var(--r-lg); margin-inline: var(--gutter); border: 1px solid var(--line); }
.sheet-wrap { background: var(--surface); }
.section > .sheet-wrap, .section .tpanel > .sheet-wrap, .cand-sec .sheet-wrap { border: 1px solid var(--line); border-radius: var(--r-lg); }
.section > .sheet-wrap table.x th:first-child, .section > .sheet-wrap table.x td:first-child { padding-left: 16px; }
table.x tr.group td { background: var(--sunk); color: var(--muted); font-weight: 500; letter-spacing: .01em; padding-block: 10px; }
.tpanel { box-shadow: var(--shadow-card); border-color: transparent; }
details.round-sum { border-top: 1px solid var(--line); padding-top: 14px; }
details.round-sum > summary { font-size: 16px; }
.legend { color: var(--muted); }
/* Developer reports */
.dev { max-width: 960px; }
.report-card { background: var(--surface); border-color: transparent; box-shadow: var(--shadow-card); border-radius: var(--r-xl); padding: 24px 28px; gap: 12px; }
.report-card .report-what { font: var(--t-lead); color: var(--fg); }
.report-card .shot { display: block; background: var(--sunk); border-radius: var(--r-md); overflow: hidden; border: 0; }
.report-card .shot img { display: block; max-height: 220px; width: auto; }
.report-card .shot img.big { max-height: none; width: 100%; }
@media (max-width: 600px) {
  .section > .head h1, .section > h1 { font-size: 34px; }
  .section:first-of-type, .bar + .section { padding-top: 32px; }
  .fixes { margin-inline: var(--gutter-phone); }
  .report-card { padding: 18px; }
}
/* Inside folds and the advisor aside, panels sit flat: the fold is already the frame. */
details .tpanel, .iv-aside .tpanel { box-shadow: none; border: 0; background: transparent; }
details.fold .fold-body > .section { padding: 12px 0 0; margin: 0; }
details.fold .fold-body > .section.gutter { padding-inline: 0; }
details.fold .fold-body > .section > .head h2 { font: 400 20px/1.3 var(--font-ui); }
details.fold .fold-body > .section > .head p { font-size: 15px; margin-top: 4px; }
.ok-t { color: var(--ok); font-weight: 600; }
.iv-aside .goal + .score { margin-top: 8px; }
/* Personal interview goal, under the greeting on the advisor / team lead home. */
.my-goal { margin-top: 36px; padding: 28px 32px; background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 6px; }
.my-goal .label { font-size: 14px; color: var(--muted); }
.my-goal .big-num { font: 300 56px/1 var(--font-ui); letter-spacing: var(--track-tight); margin-top: 8px; }
.my-goal .big-num span { font: 400 18px/1.4 var(--font-ui); color: var(--muted); letter-spacing: 0; }
.my-goal .track { margin: 14px 0 10px; height: 6px; display: flex; }
.my-goal .track > b { display: block; height: 100%; background: var(--accent-soft); }
.my-goal .track > i { border-radius: 99px 0 0 99px; }
.my-goal p { color: var(--fg); }
@media (max-width: 600px) { .my-goal { padding: 20px; margin-top: 24px; } .my-goal .big-num { font-size: 44px; } }
.camp-open { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 16px; border-radius: var(--r-md); background: var(--warn-soft); color: var(--fg); }
.camp-open.on { background: var(--ok-soft); }
/* Slot suggestions in the candidate drawer */
.suggest { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--accent-soft); }
.suggest .label { font-size: 13px; color: var(--accent); font-weight: 500; }
.suggest-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border-radius: var(--r-md); }
@media (max-width: 600px) { .suggest-row { flex-direction: column; align-items: stretch; } }

/* Outlook drafts: a link that opens the filled-in meeting or email */
a.btn { display: inline-flex; align-items: center; font: 500 15px/1.2 var(--font-ui); padding: 9px 18px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; white-space: nowrap; }
a.btn.p { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
a.btn:hover { filter: brightness(1.05); }
.outlook-draft { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.outlook-draft p { margin: 0; }
.outlook-draft pre { white-space: pre-wrap; margin: 6px 0 0; font-family: var(--font-ui); background: var(--s1); padding: 8px; border-radius: 4px; }
.room-list input { width: 100%; }

/* Metrics */
.metrics .kpis { margin: 4px 0 20px; }
.metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
@media (max-width: 600px) { .metrics-grid { grid-template-columns: 1fr; } }
.metrics-t td.num { text-align: right; font-family: var(--font-data); white-space: nowrap; }
.funnel { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.f-row { display: grid; grid-template-columns: 150px 1fr 32px 40px; align-items: center; gap: 10px; }
.f-track { height: 14px; }
.f-bar { display: block; height: 100%; min-width: 2px; background: var(--accent); border-radius: 0 4px 4px 0; }
.f-num { text-align: right; font-family: var(--font-data); }
.weeks { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 180px; padding: 22px 14px 28px; }
.w-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.w-bar { width: 70%; max-width: 36px; min-height: 0; background: var(--accent); border-radius: 4px 4px 0 0; }
.w-num { color: var(--fg); }
.w-lab { position: absolute; bottom: -20px; white-space: nowrap; }
.w-col:hover .w-bar { filter: brightness(1.15); }
.w-pace { position: absolute; left: 14px; right: 14px; border-top: 2px dashed var(--muted, #888); pointer-events: none; }
@media (max-width: 600px) { .f-row { grid-template-columns: 110px 1fr 28px 36px; gap: 6px; } }
.camp-end { padding-top: 4px; }
.camp-end.confirm { background: var(--sunk); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.camp-end.confirm p { margin: 0; }

/* Metrics: takeaways, leans, quotes */
.takeaways { margin-bottom: 16px; }
.takeaways ul { list-style: none; margin: 0; padding: 12px 18px 14px; display: flex; flex-direction: column; gap: 10px; }
.takeaways li { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: baseline; line-height: 1.45; }
.takeaways .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
.takeaways li.ok .dot { background: var(--ok); }
.takeaways li.warn .dot { background: var(--warn); }
.leans { padding: 12px 14px 4px; display: flex; flex-direction: column; gap: 10px; }
.lean-legend { display: flex; gap: 14px; }
.lean-legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.sw.yes, .lean-bar i.yes { background: var(--ok); }
.sw.unsure, .lean-bar i.unsure { background: var(--warn); }
.sw.no, .lean-bar i.no { background: var(--bad); }
.lean-row { display: grid; grid-template-columns: 150px 1fr 70px; align-items: center; gap: 10px; }
.lean-bar { display: flex; gap: 2px; height: 14px; }
.lean-bar i { display: block; height: 100%; }
.lean-bar i:first-child { border-radius: 4px 0 0 4px; }
.lean-bar i:last-child { border-radius: 0 4px 4px 0; }
.lean-bar i:only-child { border-radius: 4px; }
.quotes { margin-top: 28px; }
.quotes h2 { font-weight: 400; margin: 0 0 12px; }
.quote-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.quote { margin: 0; background: var(--surface); border-radius: var(--r-xl, 14px); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.quote blockquote { margin: 0; font-size: 16px; line-height: 1.5; }
.lean-chip { align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.lean-chip.yes { background: var(--ok-soft); color: var(--ok); }
.lean-chip.unsure { background: var(--warn-soft); color: var(--warn); }
.lean-chip.no { background: var(--bad-soft); color: var(--bad); }
@media (max-width: 600px) { .lean-row { grid-template-columns: 100px 1fr 56px; gap: 6px; } }
.delays { margin-bottom: 16px; }
.d-rows { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.d-row { display: grid; grid-template-columns: minmax(240px, 2fr) 3fr 80px minmax(140px, 2fr); align-items: center; gap: 12px; padding: 4px 0; }
.d-row .chip { margin-left: 6px; }
.d-row .f-track { position: relative; height: 14px; }
.d-row.cal .f-bar { background: var(--line); }

<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/*
 * Flux interview scheduling: data model and pure logic.
 *
 * Everything in this file is free of DOM and storage so it can be unit
 * tested with `node --test` and reused by later phases (matching, metrics).
 * It is loaded in the page as a plain script (global `FluxModel`) and in
 * Node through `module.exports`.
 */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------------
  // Teams, roles, availability values
  // ---------------------------------------------------------------------

  const TEAMS = [
    { code: 'TM', name: 'Tender management' },
    { code: 'PM', name: 'Project management' },
    { code: 'CP', name: 'Contract management' },
    { code: 'OM', name: 'Stakeholder management' },
    { code: 'P&C', name: 'People & Culture (HR)' },
  ];
  const TEAM_CODES = TEAMS.map((t) => t.code);

  const ROLES = [
    { key: 'advisor', label: 'Advisor', plural: 'Advisors' },
    { key: 'teamlead', label: 'Team lead', plural: 'Team leads' },
    { key: 'joker', label: 'Joker (HR team lead)', plural: 'Jokers' },
  ];

  // Cell values in the poll. Dutch on the sheet, short codes in the data.
  const VALUES = {
    all: { label: 'All day', nl: 'Hele dag' },
    am: { label: 'Morning', nl: 'Ochtend' },
    pm: { label: 'Afternoon', nl: 'Middag' },
    no: { label: 'Not available', nl: 'Niet' },
  };
  const NL_TO_VALUE = {
    'hele dag': 'all',
    heledag: 'all',
    'hele dag.': 'all',
    ochtend: 'am',
    "'s ochtends": 'am',
    middag: 'pm',
    "'s middags": 'pm',
    niet: 'no',
    nee: 'no',
  };

  const WEEKDAYS_NL = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
  const WEEKDAYS_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // ---------------------------------------------------------------------
  // Dates (ISO yyyy-mm-dd strings, computed in UTC so no timezone drift)
  // ---------------------------------------------------------------------

  function pad(n) {
    return String(n).padStart(2, '0');
  }
  function isoDate(y, m, d) {
    return `${y}-${pad(m)}-${pad(d)}`;
  }
  function parseIso(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d));
  }
  function toIso(date) {
    return isoDate(date.getUTCFullYear(), date.getUTCMonth() + 1, date.getUTCDate());
  }
  function addDays(iso, n) {
    const d = parseIso(iso);
    d.setUTCDate(d.getUTCDate() + n);
    return toIso(d);
  }
  function daysBetween(a, b) {
    return Math.round((parseIso(b) - parseIso(a)) / 86400000);
  }
  function weekdayOf(iso) {
    return parseIso(iso).getUTCDay();
  }
  function formatDay(iso, opts) {
    if (!iso) return '';
    const d = parseIso(iso);
    const wd = WEEKDAYS_EN[d.getUTCDay()];
    const s = `${wd} ${d.getUTCDate()} ${MONTHS_EN[d.getUTCMonth()]}`;
    return opts && opts.year ? `${s} ${d.getUTCFullYear()}` : s;
  }
  // Monday of the ISO week, used to group grid columns per week.
  function weekStart(iso) {
    const wd = weekdayOf(iso);
    return addDays(iso, wd === 0 ? -6 : 1 - wd);
  }
  function todayIso(now) {
    const d = now || new Date();
    return isoDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }

  /** Pull a yyyy-mm-dd poll date out of a file name like
   *  "Beschikbaarheid_traineegesprekken_Flux_2026-11-06.xlsx". */
  function pollDateFromFileName(name) {
    const m = /(\d{4})-(\d{2})-(\d{2})/.exec(name || '');
    return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
  }

  /**
   * Parse a column header like "ma 9-11" or "vr 4-12" into an ISO date.
   * The poll has no year, so pick the year that puts the date closest to
   * the poll date (handles a December poll that runs into January).
   * Returns null when the header is not a day column.
   */
  function parseDayHeader(header, pollDate) {
    const m = /^\s*(ma|di|wo|do|vr|za|zo)\w*\.?\s+(\d{1,2})\s*[-/.]\s*(\d{1,2})\s*$/i.exec(String(header || ''));
    if (!m) return null;
    const wd = WEEKDAYS_NL.indexOf(m[1].toLowerCase());
    const day = Number(m[2]);
    const month = Number(m[3]);
    if (month < 1 || month > 12 || day < 1 || day > 31) return null;
    const baseYear = Number((pollDate || todayIso()).slice(0, 4));
    let best = null;
    for (const y of [baseYear - 1, baseYear, baseYear + 1]) {
      const iso = isoDate(y, month, day);
      if (toIso(parseIso(iso)) !== iso) continue; // 31-11 etc.
      const dist = Math.abs(daysBetween(pollDate || todayIso(), iso));
      if (!best || dist < best.dist) best = { iso, dist };
    }
    if (!best) return null;
    return { date: best.iso, weekday: wd, weekdayMatches: weekdayOf(best.iso) === wd, label: m[0].trim() };
  }

  /** Normalise one poll cell. */
  function normalizeValue(raw) {
    if (raw === null || raw === undefined) return { value: null };
    const text = String(raw).trim();
    if (text === '') return { value: null };
    const key = text.toLowerCase().replace(/\s+/g, ' ');
    if (key in NL_TO_VALUE) {
      const value = NL_TO_VALUE[key];
      const canonical = VALUES[value].nl;
      return text === canonical ? { value } : { value, fixed: true, raw: text };
    }
    return { value: null, unknown: true, raw: text };
  }

  function normName(s) {
    return String(s || '')
      .normalize('NFKD')
      .replace(/[̀-ͯ]/g, '')
      .trim()
      .replace(/\s+/g, ' ')
      .toLowerCase();
  }

  // ---------------------------------------------------------------------
  // Poll import
  // ---------------------------------------------------------------------

  function roleFromSheetName(name) {
    const n = normName(name);
    if (/deep\s*dive|teamlead|team lead/.test(n)) return 'teamlead';
    if (/competentie|advis/.test(n)) return 'advisor';
    return null;
  }

  function isSummaryRow(name, cells) {
    const n = normName(name);
    if (!n) return true;
    if (/^voorbeeld/.test(n)) return true;
    if (/^(aantal|waarvan|totaal|total)/.test(n)) return true;
    // Formula rows: numbers or formulas in the day cells, no text answers.
    const nonEmpty = cells.filter((c) => c !== null && c !== undefined && String(c).trim() !== '');
    if (nonEmpty.length && nonEmpty.every((c) => typeof c === 'number' || /^=|^\d+$/.test(String(c).trim()))) return true;
    return false;
  }

  /**
   * Turn the raw sheets of a poll workbook into a draft snapshot.
   * `sheets` is [{ name, rows }] where rows are arrays of cell values
   * (SheetJS `sheet_to_json(ws, { header: 1, raw: false })`).
   */
  function parsePoll(sheets, opts) {
    const pollDate = (opts && opts.pollDate) || todayIso();
    const tabs = [];
    const problems = [];
    for (const sheet of sheets) {
      const rows = sheet.rows || [];
      const headerIdx = rows.findIndex((r) => r && normName(r[0]) === 'naam');
      if (headerIdx < 0) {
        problems.push({ kind: 'sheet_skipped', sheet: sheet.name, message: `Tab "${sheet.name}" has no "Naam" header row, so it was skipped.` });
        continue;
      }
      const header = rows[headerIdx];
      const teamCol = header.findIndex((h) => normName(h) === 'team');
      const remarkCol = header.findIndex((h) => /^opmerking/.test(normName(h)));
      const days = [];
      header.forEach((h, col) => {
        const parsed = parseDayHeader(h, pollDate);
        if (parsed) days.push({ col, ...parsed });
      });
      for (const d of days) {
        if (!d.weekdayMatches) {
          problems.push({ kind: 'weekday_mismatch', sheet: sheet.name, message: `Column "${d.label}" in "${sheet.name}" says ${d.label.slice(0, 2)} but ${formatDay(d.date, { year: true })} is a ${WEEKDAYS_EN[weekdayOf(d.date)]}.` });
        }
      }
      const role = roleFromSheetName(sheet.name);
      const entries = [];
      for (let i = headerIdx + 1; i < rows.length; i++) {
        const r = rows[i] || [];
        const name = r[0] == null ? '' : String(r[0]).trim();
        const dayCells = days.map((d) => r[d.col]);
        if (isSummaryRow(name, dayCells)) continue;
        const cells = {};
        const fixes = [];
        const unknowns = [];
        days.forEach((d, j) => {
          const n = normalizeValue(dayCells[j]);
          cells[d.date] = n.value;
          if (n.fixed) fixes.push({ date: d.date, raw: n.raw, value: n.value });
          if (n.unknown) unknowns.push({ date: d.date, raw: n.raw });
        });
        const team = teamCol >= 0 && r[teamCol] != null ? String(r[teamCol]).trim() : '';
        const remark = remarkCol >= 0 && r[remarkCol] != null ? String(r[remarkCol]).trim() : '';
        entries.push({ key: `${tabs.length}:${i}`, row: i + 1, name, team, remark, cells, fixes, unknowns });
      }
      tabs.push({ sheet: sheet.name, role, dates: days.map((d) => d.date), entries });
    }
    const allDates = [...new Set(tabs.flatMap((t) => t.dates))].sort();
    return {
      pollDate,
      from: allDates[0] || null,
      to: allDates[allDates.length - 1] || null,
      tabs,
      problems,
    };
  }

  function levenshtein(a, b) {
    const m = a.length;
    const n = b.length;
    const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 1; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
    }
    return dp[m][n];
  }

  function personNames(p) {
    return [p.name, ...(p.aliases || [])].map(normName).filter(Boolean);
  }

  function personHasRole(p, role) {
    if (!role) return true;
    const roles = p.roles || [];
    if (roles.includes(role)) return true;
    // The HR joker answers the team-lead poll.
    return role === 'teamlead' && roles.includes('joker');
  }

  /** Find roster suggestions for a name that did not match exactly. */
  function suggestMatches(name, team, role, people) {
    const n = normName(name);
    const first = n.split(' ')[0];
    const scored = [];
    for (const p of people) {
      let best = Infinity;
      for (const pn of personNames(p)) {
        let score = levenshtein(n, pn);
        const pFirst = pn.split(' ')[0];
        if (pFirst === first) score = Math.min(score, 1);
        if (pn.startsWith(n) || n.startsWith(pn)) score = Math.min(score, 1);
        best = Math.min(best, score);
      }
      if (best > Math.max(2, Math.floor(n.length / 3))) continue;
      if (personHasRole(p, role)) best -= 0.5;
      if (team && p.team === team) best -= 0.25;
      scored.push({ person: p, score: best });
    }
    return scored.sort((a, b) => a.score - b.score).slice(0, 3).map((s) => s.person);
  }

  /**
   * Check a draft against the roster. Returns per-entry match info and
   * a list of problems Natalie resolves before saving.
   * `decisions` maps entry key -> { action: 'match'|'add'|'skip', personId?, keepTeam? }.
   */
  function reviewDraft(draft, people, decisions) {
    decisions = decisions || {};
    const active = people.filter((p) => p.active !== false);
    const issues = [];
    const matches = {};
    for (const tab of draft.tabs) {
      for (const e of tab.entries) {
        const dec = decisions[e.key];
        let person = null;
        if (dec && dec.action === 'match') person = people.find((p) => p.id === dec.personId) || null;
        if (!person && !(dec && dec.action)) {
          const n = normName(e.name);
          const exact = people.filter((p) => personNames(p).includes(n));
          person = exact.find((p) => personHasRole(p, tab.role)) || exact[0] || null;
        }
        matches[e.key] = { person, skipped: !!(dec && dec.action === 'skip'), add: !!(dec && dec.action === 'add') };
        if (dec && dec.action === 'skip') continue;
        if (!person && !(dec && dec.action === 'add')) {
          issues.push({
            kind: 'unknown_name',
            severity: 'block',
            key: e.key,
            message: `"${e.name}" (${e.team || 'no team'}) is not on the roster.`,
            suggestions: suggestMatches(e.name, e.team, tab.role, active),
          });
        }
        if (person && e.team && person.team && e.team !== person.team && !(dec && dec.keepTeam)) {
          issues.push({
            kind: 'team_mismatch',
            severity: 'warn',
            key: e.key,
            personId: person.id,
            message: `${e.name} is in ${e.team} on the sheet but ${person.team} on the roster.`,
          });
        }
        if (e.team && !TEAM_CODES.includes(e.team)) {
          issues.push({ kind: 'unknown_team', severity: 'warn', key: e.key, message: `${e.name} has team "${e.team}", which is not a known team code.` });
        }
        if (person && tab.role && !personHasRole(person, tab.role)) {
          issues.push({ kind: 'role_mismatch', severity: 'info', key: e.key, message: `${person.name} answered the ${tab.role === 'teamlead' ? 'team lead' : 'advisor'} poll but isn't listed with that role.` });
        }
        const vals = tab.dates.map((d) => e.cells[d]);
        if (vals.every((v) => v === null)) {
          issues.push({ kind: 'no_response', severity: 'info', key: e.key, message: `${e.name} left every day blank. Counted as no response, not as unavailable.` });
        } else if (vals.every((v) => v === 'no')) {
          issues.push({ kind: 'none_available', severity: 'info', key: e.key, message: `${e.name} answered "Niet" for every day.` });
        }
        if (e.fixes.length) {
          issues.push({ kind: 'value_fixed', severity: 'info', key: e.key, message: `${e.name}: read ${e.fixes.map((f) => `"${f.raw}" on ${formatDay(f.date)} as ${VALUES[f.value].nl}`).join(', ')}.` });
        }
        if (e.unknowns.length) {
          issues.push({ kind: 'unknown_value', severity: 'warn', key: e.key, message: `${e.name}: couldn't read ${e.unknowns.map((u) => `"${u.raw}" on ${formatDay(u.date)}`).join(', ')}. Treated as no answer.` });
        }
      }
    }
    // Rostered people of a polled role who are missing from the sheet.
    const seen = new Set(Object.values(matches).filter((m) => m.person).map((m) => m.person.id));
    const roles = draft.tabs.map((t) => t.role).filter(Boolean);
    for (const p of active) {
      if (!seen.has(p.id) && roles.some((r) => personHasRole(p, r))) {
        issues.push({ kind: 'missing_from_sheet', severity: 'info', personId: p.id, message: `${p.name} (${p.team}) is on the roster but not on the sheet.` });
      }
    }
    for (const pr of draft.problems) issues.push({ ...pr, severity: 'warn' });
    return { issues, matches, blocking: issues.filter((i) => i.severity === 'block').length };
  }

  // ---------------------------------------------------------------------
  // Remarks: Claude suggests, Natalie confirms
  // ---------------------------------------------------------------------

  const RULE_KINDS = {
    window: 'Only between set hours',
    unavailable: 'Not available',
    tentative: 'Tentative, check first',
    note: 'Note only',
  };

  /** Build the prompt asking Claude to read the poll remarks. */
  function buildRemarkPrompt(draft) {
    const items = [];
    for (const tab of draft.tabs) {
      for (const e of tab.entries) {
        if (!e.remark) continue;
        items.push({
          row: e.key,
          name: e.name,
          answers: Object.fromEntries(tab.dates.map((d) => [`${d} (${WEEKDAYS_NL[weekdayOf(d)]})`, e.cells[d] ? VALUES[e.cells[d]].nl : '']).filter(([, v]) => v)),
          remark: e.remark,
          poll_dates: tab.dates,
        });
      }
    }
    const instructions = [
      'You help an HR coordinator at Flux Partners (a Dutch consultancy) schedule 1-hour, in-person interviews.',
      'Colleagues answered a half-day availability poll (Dutch). Each answer is Hele dag (all day), Ochtend (morning), Middag (afternoon) or Niet (not available).',
      'Some added a free-text remark (usually Dutch). For each remark, propose rules that narrow or qualify specific poll dates.',
      '',
      'Rule kinds:',
      '- "window": only available between from and to (HH:MM, 24h) on those dates. Use from or to alone for "until 12:00" or "from 11:00". "Graag einde middag" (preferably late afternoon) is a window from 15:00.',
      '- "unavailable": not available on those dates at all, or in the given hours.',
